<style>

  .xmeta { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 16px; font-size: 11px; color: #555; }
  .xmeta .blk { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 6px; align-items: start; }
  .xmeta .blk svg { width: 13px; height: 13px; color: #777; margin-top: 1px; }
