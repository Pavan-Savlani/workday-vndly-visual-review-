<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add Vendors · Workday VNDLY</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<link rel="stylesheet" href="styles.css">
<script src="shell.js"></script>
</head>
<body class="modal-page" data-no-shell>
<div class="backdrop">
  <style>
    .vpanel { background: #f6f6f6; border-radius: 4px; padding: 24px; display: grid; gap: 10px; }
    .vpanel .q { font-weight: 500; font-size: 17px; }
    .vpanel .input { height: 40px; }
    .vempty { border-top: 1px solid var(--divider); padding: 24px 0 8px; text-align: center; font-size: 17px; }
    .modal.vend .modal-body { gap: 24px; padding-bottom: 24px; }
    .modal.vend .modal-foot { background: #f6f6f6; }
  </style>
  <div class="modal vend" role="dialog" aria-labelledby="mt">
    <div class="modal-head center"><h2 id="mt">Add Vendors</h2><a class="x" aria-label="Close"><i data-i="x"></i></a></div>
    <div class="modal-body">
      <div class="vpanel">
        <div class="q">Select vendors to bid on the RFP</div>
        <div class="input"><span class="grow ph">Search for Vendors</span><i data-i="search"></i></div>
        <div class="small">If you don't see who you are looking for, they may need to be added to VNDLY.</div>
      </div>
      <div class="vempty">No vendors have been added</div>
    </div>
    <div class="modal-foot"><button class="btn primary" disabled>Save</button><button class="btn">Cancel</button></div>
  </div>
</div>
</body>
</html>
